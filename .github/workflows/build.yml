name: Build TCAN485 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run

      - name: Merge into single flashable binary
        run: |
          esptool.py --chip esp32 merge_bin \
            -o TCAN485_J1939_Sniffer_MERGED.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000  .pio/build/tcan485/bootloader.bin \
            0x8000  .pio/build/tcan485/partitions.bin \
            0xe000  ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/tcan485/firmware.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: TCAN485-firmware
          path: TCAN485_J1939_Sniffer_MERGED.bin
          retention-days: 30
