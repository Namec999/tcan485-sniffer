name: Build TCAN485 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Rename binary
        run: |
          cp .pio/build/tcan485/firmware.bin TCAN485_J1939_Sniffer_250k.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TCAN485-firmware
          path: TCAN485_J1939_Sniffer_250k.bin
          retention-days: 30
